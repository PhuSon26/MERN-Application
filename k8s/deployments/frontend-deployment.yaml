apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend-deployment
  namespace: mern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
      namespace: mern-app
    spec:
      containers:
        - image: mern-application-frontend
          imagePullPolicy: Always
          name: mern-frontend
          ports:
            - containerPort: 8080
              name: tcp
              protocol: TCP