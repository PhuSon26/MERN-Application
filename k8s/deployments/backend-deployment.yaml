apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend-deployment
  namespace: mern-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
      namespace: mern-app
    spec:
      containers:
        - image: mern-application-backend
          imagePullPolicy: Always
          name: mern-backend
          ports:
            - containerPort: 8080
              name: tcp
              protocol: TCP