services:
  mongodb:
    container_name: mongo-service
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  backend:
    container_name: backend
    build: ./backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - redis

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    container_name: redis-service
    image: redis:7.4.11-alpine
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  mongodb_data: